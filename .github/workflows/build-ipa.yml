name: Build 4LeChess IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor Web App
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>4LeChess</title>
            <style>
              body { margin: 0; background: #0f1115; color: #f3f4f6; font-family: -apple-system, sans-serif; padding: 16px; }
              .card { background: #181b22; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
              input, button { padding: 10px 12px; border-radius: 10px; border: none; font-size: 14px; }
              input { width: 100%; background: #101318; color: #fff; margin-bottom: 10px; border: 1px solid #2b303c; }
              button { background: #38bdf8; color: #07131a; font-weight: 700; width: 100%; }
              .item { background: #11141a; padding: 10px; border-radius: 10px; margin-top: 8px; font-size: 13px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h2 style="margin:0 0 10px 0;">4LeChess</h2>
              <input id="user" value="CMaj7-9" placeholder="Username Chess.com" />
              <button onclick="loadGames()">Muat Pertandingan</button>
              <div id="status" style="margin-top:10px;font-size:12px;color:#9ca3af;">Siap memuat data...</div>
              <div id="list"></div>
            </div>
            <script>
              async function loadGames() {
                const u = (document.getElementById('user').value || 'CMaj7-9').trim().toLowerCase();
                const status = document.getElementById('status');
                const list = document.getElementById('list');
                status.textContent = 'Memuat arsip ' + u + '...';
                list.innerHTML = '';
                try {
                  const r1 = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
                  const d1 = await r1.json();
                  const last = d1.archives[d1.archives.length - 1];
                  const r2 = await fetch(last);
                  const d2 = await r2.json();
                  const games = (d2.games || []).slice(-6).reverse();
                  status.textContent = `Ditemukan ${games.length} pertandingan terakhir.`;
                  games.forEach((g, i) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.textContent = `#${i+1} ${g.white.username} vs ${g.black.username} (${g.white.result})`;
                    list.appendChild(div);
                  });
                } catch (e) {
                  status.textContent = 'Gagal memuat data Chess.com.';
                }
              }
              loadGames();
            </script>
          </body>
          </html>
          EOF

      - name: Init & Add Capacitor iOS
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "4LeChess" "com.alesyhr.4lechess" --web-dir=www
          npx cap add ios
          npx cap sync ios

      - name: Build Native iOS App with Xcode
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$PWD/build_out

      - name: Package IPA for KSign
        run: |
          mkdir -p Payload
          cp -r build_out/App.app Payload/4LeChess.app
          zip -r 4LeChess.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4LeChess-IPA
          path: 4LeChess.ipa
