name: Build 4LeChess IPA

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Web App
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>4LeChess</title>
            <style>
              :root {
                --bg: #0b0d12;
                --panel: #141821;
                --panel-2: #1b202c;
                --border: #2a3142;
                --text: #f5f7fa;
                --muted: #98a2b3;
                --accent: #38bdf8;
                --light-sq: #ecefd9;
                --dark-sq: #769656;
              }
              * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
              }
              html, body {
                margin: 0;
                padding: 0;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
                overscroll-behavior-y: none;
              }
              body {
                padding: calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
              }
              .top-title {
                text-align: center;
                font-size: 22px;
                font-weight: 800;
                letter-spacing: 0.4px;
                margin-bottom: 12px;
              }
              .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 13px;
                margin-bottom: 12px;
              }
              .input-group {
                display: flex;
                gap: 8px;
              }
              input {
                flex: 1;
                min-width: 0;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 11px 12px;
                font-size: 14px;
              }
              button {
                background: var(--accent);
                color: #06121a;
                border: none;
                border-radius: 12px;
                padding: 11px 14px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
              }
              button.nav-btn {
                background: var(--panel-2);
                color: var(--text);
                border: 1px solid var(--border);
                font-size: 16px;
                padding: 11px 0;
              }
              button.nav-btn:active {
                background: #272f40;
              }
              .status {
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
                line-height: 1.4;
              }
              .board {
                width: 100%;
                aspect-ratio: 1 / 1;
                display: grid;
                grid-template-columns: repeat(8, 1fr);
                grid-template-rows: repeat(8, 1fr);
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid var(--border);
              }
              .sq {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 6%;
              }
              .sq.light { background: var(--light-sq); }
              .sq.dark { background: var(--dark-sq); }
              .sq svg {
                width: 100%;
                height: 100%;
                display: block;
                filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
              }
              .move-bar {
                margin-top: 10px;
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 10px 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 13px;
              }
              .nav-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                margin-top: 10px;
              }
              .section-label {
                font-size: 13px;
                font-weight: 700;
                margin-bottom: 6px;
              }
              .moves-list {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 10px;
                max-height: 120px;
                overflow-y: auto;
                font-size: 12px;
                line-height: 1.65;
                color: var(--muted);
              }
              .game-card {
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 10px 12px;
                margin-top: 8px;
              }
              .game-card.active {
                border-color: var(--accent);
              }
              .game-title {
                font-size: 13px;
                font-weight: 700;
              }
              .game-meta {
                font-size: 11px;
                color: var(--muted);
                margin-top: 3px;
                word-break: break-all;
              }
            </style>
          </head>
          <body>
            <div class="top-title">4LeChess</div>

            <div class="card">
              <div class="input-group">
                <input id="gameLinkInput" type="url" placeholder="Tempel link game Chess.com..." autocomplete="off" />
                <button id="loadBtn" type="button">Bedah</button>
              </div>
              <div id="statusText" class="status">Tempel link game yang sudah dimainkan untuk langsung memuat dan membedah langkah.</div>
            </div>

            <div class="card">
              <div id="chessBoard" class="board"></div>
              <div class="move-bar">
                <span id="currentMoveLabel">Posisi Awal</span>
                <span id="moveCounter" style="color:var(--accent);font-weight:700;">0 / 0</span>
              </div>
              <div class="nav-grid">
                <button id="firstBtn" class="nav-btn" type="button">|&lt;</button>
                <button id="prevBtn" class="nav-btn" type="button">&lt;</button>
                <button id="nextBtn" class="nav-btn" type="button">&gt;</button>
                <button id="lastBtn" class="nav-btn" type="button">&gt;|</button>
              </div>
            </div>

            <div class="card">
              <div id="matchupTitle" class="section-label">Ringkasan &amp; Daftar Langkah</div>
              <div id="movesDisplay" class="moves-list">Belum ada game yang dimuat.</div>
            </div>

            <div class="card">
              <div class="section-label">Riwayat Game Cepat (CMaj7-9)</div>
              <div id="recentGames" class="status" style="margin-top:0;">Memuat riwayat game...</div>
            </div>

            <script>
              let lastTouchEnd = 0;
              document.addEventListener("touchend", function (e) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                  e.preventDefault();
                }
                lastTouchEnd = now;
              }, { passive: false });
              document.addEventListener("dblclick", function (e) {
                e.preventDefault();
              });

              let audioCtx = null;
              function playMoveSound(type = "move") {
                try {
                  const Ctx = window.AudioContext || window.webkitAudioContext;
                  if (!Ctx) return;
                  if (!audioCtx) audioCtx = new Ctx();
                  if (audioCtx.state === "suspended") audioCtx.resume();

                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  if (type === "capture") {
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(340, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.09);
                  } else {
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.06);
                  }
                  gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start();
                  osc.stop(audioCtx.currentTime + 0.095);
                } catch (_) {}
              }

              const PIECE_SVG = {
                wP: '<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03C15.41 27.09 11 31.58 11 39.5H34c0-7.92-4.41-12.41-7.41-13.47C28.06 24.84 29 23.03 29 21c0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round"/></svg>',
                wR: '<svg viewBox="0 0 45 45"><g fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23"/></g></svg>',
                wN: '<svg viewBox="0 0 45 45"><g fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/><circle cx="15" cy="15.5" r="1.2" fill="#1f242d"/></g></svg>',
                wB: '<svg viewBox="0 0 45 45"><g fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.46 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.2"/></g></svg>',
                wQ: '<svg viewBox="0 0 45 45"><g fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="14" cy="9" r="2"/><circle cx="22.5" cy="8" r="2"/><circle cx="31" cy="9" r="2"/><circle cx="39" cy="12" r="2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-5-14-4 14-5-14-5 14-7-11 2 12z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/></g></svg>',
                wK: '<svg viewBox="0 0 45 45"><g fill="#ffffff" stroke="#1f242d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>',
                bP: '<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03C15.41 27.09 11 31.58 11 39.5H34c0-7.92-4.41-12.41-7.41-13.47C28.06 24.84 29 23.03 29 21c0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round"/></svg>',
                bR: '<svg viewBox="0 0 45 45"><g fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23"/></g></svg>',
                bN: '<svg viewBox="0 0 45 45"><g fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/><circle cx="15" cy="15.5" r="1.2" fill="#ecefd9"/></g></svg>',
                bB: '<svg viewBox="0 0 45 45"><g fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.46 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.2"/></g></svg>',
                bQ: '<svg viewBox="0 0 45 45"><g fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="14" cy="9" r="2"/><circle cx="22.5" cy="8" r="2"/><circle cx="31" cy="9" r="2"/><circle cx="39" cy="12" r="2"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-5-14-4 14-5-14-5 14-7-11 2 12z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/></g></svg>',
                bK: '<svg viewBox="0 0 45 45"><g fill="#1e232d" stroke="#0b0d12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>'
              };

              const INIT_BOARD = [
                ["bR","bN","bB","bQ","bK","bB","bN","bR"],
                ["bP","bP","bP","bP","bP","bP","bP","bP"],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                ["wP","wP","wP","wP","wP","wP","wP","wP"],
                ["wR","wN","wB","wQ","wK","wB","wN","wR"]
              ];
              const FILES = ["a","b","c","d","e","f","g","h"];

              let states = [{ board: cloneBoard(INIT_BOARD), label: "Posisi Awal", isCapture: false }];
              let currentPly = 0;
              let recentGamesCache = [];

              function cloneBoard(b) {
                return b.map(row => row.slice());
              }

              function renderBoard() {
                const boardEl = document.getElementById("chessBoard");
                const st = states[currentPly] || states[0];
                let out = "";
                for (let r = 0; r < 8; r++) {
                  for (let c = 0; c < 8; c++) {
                    const light = (r + c) % 2 === 0;
                    const p = st.board[r][c];
                    out += '<div class="sq ' + (light ? "light" : "dark") + '">' + (p ? PIECE_SVG[p] : "") + "</div>";
                  }
                }
                boardEl.innerHTML = out;
                document.getElementById("currentMoveLabel").textContent = st.label;
                document.getElementById("moveCounter").textContent = currentPly + " / " + (states.length - 1);
              }

              function setPly(targetIdx, withSound = true) {
                const clamped = Math.max(0, Math.min(states.length - 1, targetIdx));
                const changed = clamped !== currentPly;
                currentPly = clamped;
                renderBoard();
                if (changed && withSound) {
                  playMoveSound(states[currentPly].isCapture ? "capture" : "move");
                }
              }

              function extractMoveTextFromPgn(pgn) {
                if (!pgn) return "";
                const lines = pgn.split(/\r?\n/);
                const moveLines = lines.filter(line => {
                  const trimmed = line.trim();
                  return trimmed && !trimmed.startsWith("[");
                });
                return moveLines.join(" ")
                  .replace(/\{[^}]*\}/g, " ")
                  .replace(/\([^)]*\)/g, " ")
                  .replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g, " ")
                  .replace(/\s+/g, " ")
                  .trim();
              }

              function tokenizeSans(moveText) {
                if (!moveText) return [];
                const tokens = moveText.split(/\s+/);
                const sans = [];
                for (const tok of tokens) {
                  if (/^\d+\.+$/.test(tok)) continue;
                  const cleaned = tok.replace(/^\d+\.+/, "").trim();
                  if (cleaned) sans.push(cleaned);
                }
                return sans;
              }

              function pathClear(board, r1, c1, r2, c2) {
                const dr = Math.sign(r2 - r1);
                const dc = Math.sign(c2 - c1);
                let r = r1 + dr;
                let c = c1 + dc;
                while (r !== r2 || c !== c2) {
                  if (board[r][c] !== null) return false;
                  r += dr;
                  c += dc;
                }
                return true;
              }

              function buildGameStates(pgn) {
                const moveText = extractMoveTextFromPgn(pgn);
                const sans = tokenizeSans(moveText);
                let board = cloneBoard(INIT_BOARD);
                const nextStates = [{ board: cloneBoard(board), label: "Posisi Awal", isCapture: false }];

                for (let i = 0; i < sans.length; i++) {
                  const rawSan = sans[i];
                  const san = rawSan.replace(/[+#!?]+$/g, "");
                  const isWhite = i % 2 === 0;
                  const color = isWhite ? "w" : "b";
                  const moveNo = Math.floor(i / 2) + 1;
                  const label = isWhite ? (moveNo + ". " + rawSan) : (moveNo + "... " + rawSan);
                  let captured = false;

                  if (san === "O-O" || san === "O-O-O") {
                    const row = isWhite ? 7 : 0;
                    board[row][4] = null;
                    if (san === "O-O") {
                      board[row][7] = null;
                      board[row][6] = color + "K";
                      board[row][5] = color + "R";
                    } else {
                      board[row][0] = null;
                      board[row][2] = color + "K";
                      board[row][3] = color + "R";
                    }
                    nextStates.push({ board: cloneBoard(board), label, isCapture: false });
                    continue;
                  }

                  const promoMatch = san.match(/=([QRBN])$/);
                  const promoType = promoMatch ? promoMatch[1] : null;
                  const baseSan = san.replace(/=[QRBN]$/, "");
                  const targetMatch = baseSan.match(/([a-h])([1-8])$/);
                  if (!targetMatch) {
                    nextStates.push({ board: cloneBoard(board), label, isCapture: false });
                    continue;
                  }

                  const toCol = FILES.indexOf(targetMatch[1]);
                  const toRow = 8 - Number(targetMatch[2]);
                  const hasPiecePrefix = /^[KQRBN]/.test(baseSan);
                  const pieceType = hasPiecePrefix ? baseSan[0] : "P";
                  const pieceCode = color + pieceType;

                  const hint = baseSan.slice(hasPiecePrefix ? 1 : 0, -2).replace(/x/g, "");
                  const reqFile = hint.match(/[a-h]/) ? FILES.indexOf(hint.match(/[a-h]/)[0]) : null;
                  const reqRank = hint.match(/[1-8]/) ? 8 - Number(hint.match(/[1-8]/)[0]) : null;

                  let found = false;
                  for (let r = 0; r < 8 && !found; r++) {
                    for (let c = 0; c < 8 && !found; c++) {
                      if (board[r][c] !== pieceCode) continue;
                      if (reqFile !== null && c !== reqFile) continue;
                      if (reqRank !== null && r !== reqRank) continue;

                      const dr = toRow - r;
                      const dc = toCol - c;
                      const adr = Math.abs(dr);
                      const adc = Math.abs(dc);
                      let ok = false;

                      if (pieceType === "P") {
                        if (isWhite) {
                          ok = (dc === 0 && dr === -1 && !board[toRow][toCol]) ||
                               (dc === 0 && r === 6 && dr === -2 && !board[5][c] && !board[4][c]) ||
                               (adc === 1 && dr === -1);
                        } else {
                          ok = (dc === 0 && dr === 1 && !board[toRow][toCol]) ||
                               (dc === 0 && r === 1 && dr === 2 && !board[2][c] && !board[3][c]) ||
                               (adc === 1 && dr === 1);
                        }
                      } else if (pieceType === "N") {
                        ok = (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
                      } else if (pieceType === "B") {
                        ok = adr === adc && adr > 0 && pathClear(board, r, c, toRow, toCol);
                      } else if (pieceType === "R") {
                        ok = (dr === 0 || dc === 0) && (adr + adc > 0) && pathClear(board, r, c, toRow, toCol);
                      } else if (pieceType === "Q") {
                        ok = (adr === adc || dr === 0 || dc === 0) && (adr + adc > 0) && pathClear(board, r, c, toRow, toCol);
                      } else if (pieceType === "K") {
                        ok = adr <= 1 && adc <= 1 && (adr + adc > 0);
                      }

                      if (ok) {
                        if (board[toRow][toCol] !== null) captured = true;
                        if (pieceType === "P" && adc === 1 && !board[toRow][toCol]) {
                          board[r][toCol] = null;
                          captured = true;
                        }
                        board[toRow][toCol] = color + (promoType || pieceType);
                        board[r][c] = null;
                        found = true;
                      }
                    }
                  }

                  nextStates.push({ board: cloneBoard(board), label, isCapture: captured || baseSan.includes("x") });
                }

                states = nextStates;
                currentPly = 0;
                renderBoard();
                document.getElementById("movesDisplay").textContent = moveText || "Tidak ada langkah PGN pada game ini.";
              }

              function parseGameUrl(raw) {
                const trimmed = (raw || "").trim();
                if (!trimmed) return null;
                const match = trimmed.match(/chess\.com\/(?:game\/)?(?:live|daily)\/(\d+)/i) || trimmed.match(/chess\.com\/game\/(\d+)/i) || trimmed.match(/^(\d{6,})$/);
                if (!match) return null;
                return {
                  id: match[1],
                  normalizedUrl: trimmed.startsWith("http") ? trimmed : ("https://www.chess.com/game/live/" + match[1])
                };
              }

              function applyGameObject(gameObj, labelHint = "") {
                const white = (gameObj.white && gameObj.white.username) || "Putih";
                const black = (gameObj.black && gameObj.black.username) || "Hitam";
                const wRes = (gameObj.white && gameObj.white.result) || "-";
                const bRes = (gameObj.black && gameObj.black.result) || "-";
                document.getElementById("matchupTitle").textContent = white + " vs " + black + " (" + wRes + " / " + bRes + ")";
                document.getElementById("statusText").textContent = labelHint || ("Game dimuat: " + white + " vs " + black + ". Tekan > untuk melangkah.");
                buildGameStates(gameObj.pgn || "");
              }

              async function loadGameFromLink() {
                const inputEl = document.getElementById("gameLinkInput");
                const parsed = parseGameUrl(inputEl.value);
                if (!parsed) {
                  document.getElementById("statusText").textContent = "Masukkan link game Chess.com yang valid (contoh: https://www.chess.com/game/live/123456789).";
                  return;
                }

                document.getElementById("statusText").textContent = "Memuat data game ID " + parsed.id + "...";

                const matchedRecent = recentGamesCache.find(g => String(g.url || "").includes(parsed.id));
                if (matchedRecent) {
                  applyGameObject(matchedRecent, "Game ditemukan dan dimuat otomatis.");
                  return;
                }

                try {
                  const cbRes = await fetch("https://www.chess.com/callback/live/game/" + parsed.id);
                  if (cbRes.ok) {
                    const cbData = await cbRes.json();
                    if (cbData && cbData.game && cbData.game.pgn) {
                      applyGameObject({
                        white: { username: cbData.game.white && cbData.game.white.username, result: cbData.game.white && cbData.game.white.result },
                        black: { username: cbData.game.black && cbData.game.black.username, result: cbData.game.black && cbData.game.black.result },
                        pgn: cbData.game.pgn
                      }, "Game berhasil dimuat dari link.");
                      return;
                    }
                  }
                } catch (_) {}

                try {
                  const archRes = await fetch("https://api.chess.com/pub/player/cmaj7-9/games/archives");
                  const archData = await archRes.json();
                  const archives = (archData.archives || []).slice().reverse();
                  for (const url of archives.slice(0, 4)) {
                    const gRes = await fetch(url);
                    const gData = await gRes.json();
                    const found = (gData.games || []).find(g => String(g.url || "").includes(parsed.id));
                    if (found) {
                      applyGameObject(found, "Game ditemukan di arsip dan dimuat.");
                      return;
                    }
                  }
                } catch (_) {}

                document.getElementById("statusText").textContent = "Game tidak ditemukan atau masih berlangsung. Gunakan link game yang sudah selesai.";
              }

              async function loadRecentHistory() {
                const box = document.getElementById("recentGames");
                try {
                  const res = await fetch("https://api.chess.com/pub/player/cmaj7-9/games/archives");
                  const data = await res.json();
                  const archives = data.archives || [];
                  if (!archives.length) {
                    box.textContent = "Tidak ada riwayat game.";
                    return;
                  }
                  const gamesRes = await fetch(archives[archives.length - 1]);
                  const gamesJson = await gamesRes.json();
                  recentGamesCache = (gamesJson.games || []).slice(-5).reverse();

                  if (!recentGamesCache.length) {
                    box.textContent = "Belum ada game terbaru.";
                    return;
                  }

                  box.innerHTML = "";
                  recentGamesCache.forEach((g, idx) => {
                    const item = document.createElement("div");
                    item.className = "game-card" + (idx === 0 ? " active" : "");
                    item.innerHTML = '<div class="game-title">' + g.white.username + ' vs ' + g.black.username + '</div><div class="game-meta">' + (g.url || "") + '</div>';
                    item.addEventListener("click", function () {
                      document.querySelectorAll(".game-card").forEach((el, i) => el.classList.toggle("active", i === idx));
                      if (g.url) {
                        document.getElementById("gameLinkInput").value = g.url;
                      }
                      applyGameObject(g, "Game dipilih dan dimuat.");
                      playMoveSound("move");
                    });
                    box.appendChild(item);
                  });

                  if (recentGamesCache[0] && recentGamesCache[0].url) {
                    document.getElementById("gameLinkInput").value = recentGamesCache[0].url;
                    applyGameObject(recentGamesCache[0], "Game terbaru otomatis dimuat. Tekan > untuk mulai melangkah.");
                  }
                } catch (_) {
                  box.textContent = "Tempel link game Chess.com di atas untuk memuat.";
                }
              }

              const linkInput = document.getElementById("gameLinkInput");
              linkInput.addEventListener("input", function () {
                if (parseGameUrl(linkInput.value)) {
                  loadGameFromLink();
                }
              });
              linkInput.addEventListener("change", loadGameFromLink);
              document.getElementById("loadBtn").addEventListener("click", loadGameFromLink);

              document.getElementById("firstBtn").addEventListener("click", function () { setPly(0); });
              document.getElementById("prevBtn").addEventListener("click", function () { setPly(currentPly - 1); });
              document.getElementById("nextBtn").addEventListener("click", function () { setPly(currentPly + 1); });
              document.getElementById("lastBtn").addEventListener("click", function () { setPly(states.length - 1); });

              renderBoard();
              loadRecentHistory();
            </script>
          </body>
          </html>
          EOF
      - name: Build Capacitor iOS
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "4LeChess" "com.alesyhr.fourlechess" --web-dir=www
          npx cap add ios
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '17.0'/g" ios/App/Podfile
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CONFIGURATION_BUILD_DIR=$PWD/build_out
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build_out/App.app Payload/4LeChess.app
          zip -r 4LeChess.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 4LeChess-IPA
          path: 4LeChess.ipa
