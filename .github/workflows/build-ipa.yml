name: Build 4LeChess IPA

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Web App
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>4LeChess</title>
            <style>
              :root {
                --bg: #0c0e13;
                --panel: #151821;
                --panel-2: #1c202c;
                --border: #2a3040;
                --text: #f3f4f6;
                --muted: #9aa3b2;
                --accent: #38bdf8;
                --accent-2: #22c55e;
                --light-sq: #ebecd0;
                --dark-sq: #779556;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
              }
              .header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 12px;
              }
              .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
              .badge {
                font-size: 11px;
                padding: 4px 8px;
                border-radius: 999px;
                background: var(--panel-2);
                color: var(--accent);
                border: 1px solid var(--border);
              }
              .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 14px;
                margin-bottom: 12px;
              }
              .row { display: flex; gap: 8px; }
              input {
                flex: 1;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 11px 12px;
                font-size: 14px;
              }
              button {
                background: var(--accent);
                color: #06121a;
                border: none;
                border-radius: 12px;
                padding: 11px 14px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
              }
              button.secondary {
                background: var(--panel-2);
                color: var(--text);
                border: 1px solid var(--border);
              }
              .status {
                font-size: 12px;
                color: var(--muted);
                margin-top: 8px;
              }
              .board-wrap {
                width: 100%;
                aspect-ratio: 1 / 1;
                display: grid;
                grid-template-columns: repeat(8, 1fr);
                grid-template-rows: repeat(8, 1fr);
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid var(--border);
              }
              .sq {
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: clamp(20px, 6.5vw, 34px);
                user-select: none;
              }
              .sq.light { background: var(--light-sq); color: #111; }
              .sq.dark { background: var(--dark-sq); color: #111; }
              .controls {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                margin-top: 10px;
              }
              .move-info {
                margin-top: 10px;
                padding: 10px 12px;
                border-radius: 12px;
                background: var(--panel-2);
                font-size: 13px;
                display: flex;
                justify-content: space-between;
                align-items: center;
              }
              .moves-box {
                margin-top: 10px;
                max-height: 110px;
                overflow-y: auto;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 8px 10px;
                font-size: 12px;
                line-height: 1.6;
                color: var(--muted);
              }
              .game-item {
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 11px 12px;
                margin-top: 8px;
                cursor: pointer;
              }
              .game-item.active {
                border-color: var(--accent);
              }
              .game-title { font-size: 13px; font-weight: 700; }
              .game-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="brand">4LeChess</div>
              <div class="badge">Game Review</div>
            </div>

            <div class="card">
              <div class="row">
                <input id="username" value="CMaj7-9" placeholder="Username Chess.com" />
                <button onclick="fetchGames()">Muat</button>
              </div>
              <div id="status" class="status">Menyiapkan data...</div>
            </div>

            <div class="card">
              <div id="board" class="board-wrap"></div>
              <div class="move-info">
                <span id="moveLabel">Posisi Awal</span>
                <span id="evalTag" style="color:var(--accent);font-weight:700;">Ply 0</span>
              </div>
              <div class="controls">
                <button class="secondary" onclick="goTo(0)">|&lt;</button>
                <button class="secondary" onclick="goTo(ply - 1)">&lt;</button>
                <button class="secondary" onclick="goTo(ply + 1)">&gt;</button>
                <button class="secondary" onclick="goTo(fens.length - 1)">&gt;|</button>
              </div>
              <div id="movesList" class="moves-box">Pilih pertandingan di bawah untuk melihat langkah.</div>
            </div>

            <div class="card">
              <div style="font-size:14px;font-weight:700;">Pertandingan Terakhir</div>
              <div id="gamesList"></div>
            </div>

            <script>
              const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";
              const PIECES = {
                K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙",
                k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟"
              };
              const FILES = ["a","b","c","d","e","f","g","h"];

              let fens = [START_FEN];
              let moveLabels = ["Awal"];
              let ply = 0;
              let gamesData = [];

              function fenToGrid(fen) {
                const placement = fen.split(" ")[0];
                const rows = placement.split("/");
                const grid = [];
                for (const r of rows) {
                  const line = [];
                  for (const ch of r) {
                    if (/[1-8]/.test(ch)) {
                      for (let i = 0; i < Number(ch); i++) line.push(null);
                    } else {
                      line.push(ch);
                    }
                  }
                  grid.push(line);
                }
                return grid;
              }

              function gridToFen(grid) {
                return grid.map(row => {
                  let out = "";
                  let empty = 0;
                  for (const cell of row) {
                    if (!cell) {
                      empty++;
                    } else {
                      if (empty > 0) { out += empty; empty = 0; }
                      out += cell;
                    }
                  }
                  if (empty > 0) out += empty;
                  return out;
                }).join("/");
              }

              function renderBoard() {
                const boardEl = document.getElementById("board");
                const grid = fenToGrid(fens[ply] || START_FEN);
                let html = "";
                for (let r = 0; r < 8; r++) {
                  for (let c = 0; c < 8; c++) {
                    const isLight = (r + c) % 2 === 0;
                    const piece = grid[r][c];
                    html += `<div class="sq ${isLight ? "light" : "dark"}">${piece ? (PIECES[piece] || "") : ""}</div>`;
                  }
                }
                boardEl.innerHTML = html;
                document.getElementById("moveLabel").textContent = moveLabels[ply] || "Posisi";
                document.getElementById("evalTag").textContent = `Langkah ${ply}/${Math.max(0, fens.length - 1)}`;
              }

              function goTo(target) {
                ply = Math.max(0, Math.min(fens.length - 1, target));
                renderBoard();
              }

              function parseSanMoves(pgn) {
                if (!pgn) return [];
                const cleaned = pgn
                  .replace(/\{[^}]*\}/g, " ")
                  .replace(/\([^)]*\)/g, " ")
                  .replace(/\d+\.(\.\.)?/g, " ")
                  .replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g, " ")
                  .trim();
                return cleaned.split(/\s+/).filter(Boolean);
              }

              function buildPositionsFromPgn(pgn) {
                const sans = parseSanMoves(pgn);
                let grid = fenToGrid(START_FEN);
                const nextFens = [gridToFen(grid)];
                const nextLabels = ["Posisi Awal"];

                for (let i = 0; i < sans.length; i++) {
                  const san = sans[i].replace(/[+#!?]+$/g, "");
                  const isWhiteTurn = i % 2 === 0;
                  const moveNum = Math.floor(i / 2) + 1;
                  const prefix = isWhiteTurn ? `${moveNum}. ${san}` : `${moveNum}... ${san}`;

                  const promoMatch = san.match(/=([QRBN])$/);
                  const promoPiece = promoMatch ? (isWhiteTurn ? promoMatch[1] : promoMatch[1].toLowerCase()) : null;
                  const cleanSan = san.replace(/=[QRBN]$/, "");

                  if (cleanSan === "O-O" || cleanSan === "O-O-O") {
                    const row = isWhiteTurn ? 7 : 0;
                    const kingChar = isWhiteTurn ? "K" : "k";
                    const rookChar = isWhiteTurn ? "R" : "r";
                    grid[row][4] = null;
                    if (cleanSan === "O-O") {
                      grid[row][7] = null;
                      grid[row][6] = kingChar;
                      grid[row][5] = rookChar;
                    } else {
                      grid[row][0] = null;
                      grid[row][2] = kingChar;
                      grid[row][3] = rookChar;
                    }
                    nextFens.push(gridToFen(grid));
                    nextLabels.push(prefix);
                    continue;
                  }

                  const targetMatch = cleanSan.match(/([a-h])([1-8])$/);
                  if (!targetMatch) {
                    nextFens.push(gridToFen(grid));
                    nextLabels.push(prefix);
                    continue;
                  }

                  const toCol = FILES.indexOf(targetMatch[1]);
                  const toRow = 8 - Number(targetMatch[2]);
                  const firstChar = cleanSan[0];
                  const isPieceMove = /^[KQRBN]$/.test(firstChar);
                  const pieceCode = isPieceMove
                    ? (isWhiteTurn ? firstChar : firstChar.toLowerCase())
                    : (isWhiteTurn ? "P" : "p");

                  const disambig = cleanSan.slice(isPieceMove ? 1 : 0, -2).replace(/x/g, "");
                  const reqFile = disambig.match(/[a-h]/) ? FILES.indexOf(disambig.match(/[a-h]/)[0]) : null;
                  const reqRank = disambig.match(/[1-8]/) ? 8 - Number(disambig.match(/[1-8]/)[0]) : null;

                  let moved = false;
                  for (let r = 0; r < 8 && !moved; r++) {
                    for (let c = 0; c < 8 && !moved; c++) {
                      if (grid[r][c] !== pieceCode) continue;
                      if (reqFile !== null && c !== reqFile) continue;
                      if (reqRank !== null && r !== reqRank) continue;

                      const dr = toRow - r;
                      const dc = toCol - c;
                      const adr = Math.abs(dr);
                      const adc = Math.abs(dc);

                      let valid = false;
                      if (pieceCode === "P") {
                        valid = (dc === 0 && dr === -1 && !grid[toRow][toCol]) ||
                                (dc === 0 && r === 6 && dr === -2 && !grid[5][c] && !grid[4][c]) ||
                                (adc === 1 && dr === -1);
                      } else if (pieceCode === "p") {
                        valid = (dc === 0 && dr === 1 && !grid[toRow][toCol]) ||
                                (dc === 0 && r === 1 && dr === 2 && !grid[2][c] && !grid[3][c]) ||
                                (adc === 1 && dr === 1);
                      } else if (pieceCode === "N" || pieceCode === "n") {
                        valid = (adr === 2 && adc === 1) || (adr === 1 && adc === 2);
                      } else if (pieceCode === "B" || pieceCode === "b") {
                        valid = adr === adc && adr > 0;
                      } else if (pieceCode === "R" || pieceCode === "r") {
                        valid = (dr === 0 || dc === 0) && (adr + adc > 0);
                      } else if (pieceCode === "Q" || pieceCode === "q") {
                        valid = (adr === adc || dr === 0 || dc === 0) && (adr + adc > 0);
                      } else if (pieceCode === "K" || pieceCode === "k") {
                        valid = adr <= 1 && adc <= 1 && (adr + adc > 0);
                      }

                      if (valid) {
                        if ((pieceCode === "P" || pieceCode === "p") && adc === 1 && !grid[toRow][toCol]) {
                          grid[r][toCol] = null;
                        }
                        grid[toRow][toCol] = promoPiece || pieceCode;
                        grid[r][c] = null;
                        moved = true;
                      }
                    }
                  }

                  nextFens.push(gridToFen(grid));
                  nextLabels.push(prefix);
                }

                fens = nextFens;
                moveLabels = nextLabels;
                ply = 0;
                renderBoard();
                document.getElementById("movesList").textContent = sans.length
                  ? sans.map((m, idx) => (idx % 2 === 0 ? `${Math.floor(idx/2)+1}. ${m}` : m)).join(" ")
                  : "PGN tidak tersedia untuk pertandingan ini.";
              }

              function selectGame(index) {
                const g = gamesData[index];
                if (!g) return;
                document.querySelectorAll(".game-item").forEach((el, i) => {
                  el.classList.toggle("active", i === index);
                });
                buildPositionsFromPgn(g.pgn || "");
              }

              async function fetchGames() {
                const u = (document.getElementById("username").value || "CMaj7-9").trim().toLowerCase();
                const status = document.getElementById("status");
                const listEl = document.getElementById("gamesList");
                status.textContent = `Memuat arsip pertandingan ${u}...`;
                listEl.innerHTML = "";
                try {
                  const resArch = await fetch(`https://api.chess.com/pub/player/${u}/games/archives`);
                  const dataArch = await resArch.json();
                  const archives = dataArch.archives || [];
                  if (!archives.length) {
                    status.textContent = "Tidak ada arsip ditemukan.";
                    return;
                  }
                  const resGames = await fetch(archives[archives.length - 1]);
                  const dataGames = await resGames.json();
                  gamesData = (dataGames.games || []).slice(-8).reverse();
                  status.textContent = `Menampilkan ${gamesData.length} pertandingan terakhir (${u}). Ketuk salah satu untuk me-review.`;

                  gamesData.forEach((g, idx) => {
                    const div = document.createElement("div");
                    div.className = "game-item" + (idx === 0 ? " active" : "");
                    div.onclick = () => selectGame(idx);
                    div.innerHTML = `
                      <div class="game-title">${g.white.username} vs ${g.black.username}</div>
                      <div class="game-sub">${g.time_class || "game"} • Putih: ${g.white.result} • Hitam: ${g.black.result}</div>
                    `;
                    listEl.appendChild(div);
                  });

                  if (gamesData.length > 0) {
                    selectGame(0);
                  }
                } catch (err) {
                  status.textContent = "Gagal mengambil data dari Chess.com.";
                }
              }

              renderBoard();
              fetchGames();
            </script>
          </body>
          </html>
          EOF
      - name: Build Capacitor iOS
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap init "4LeChess" "com.alesyhr.fourlechess" --web-dir=www
          npx cap add ios
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '17.0'/g" ios/App/Podfile
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CONFIGURATION_BUILD_DIR=$PWD/build_out
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build_out/App.app Payload/4LeChess.app
          zip -r 4LeChess.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 4LeChess-IPA
          path: 4LeChess.ipa
