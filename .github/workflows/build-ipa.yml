name: Build 4LeChess IPA

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Web App
        run: |
          mkdir -p www
          printf '%s\n' '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>4LeChess</title></head><body style="background:#0f1115;color:#fff;font-family:-apple-system,sans-serif;padding:16px"><h2>4LeChess</h2><input id="u" value="CMaj7-9" style="width:100%;padding:10px;border-radius:8px;border:0"><button onclick="run()" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:0;background:#38bdf8;font-weight:700">Muat Pertandingan</button><div id="out" style="margin-top:12px"></div><script>async function run(){const u=(document.getElementById("u").value||"CMaj7-9").trim().toLowerCase();const out=document.getElementById("out");out.textContent="Memuat...";try{const a=await(await fetch("https://api.chess.com/pub/player/"+u+"/games/archives")).json();const g=await(await fetch(a.archives[a.archives.length-1])).json();out.innerHTML=(g.games||[]).slice(-6).reverse().map((x,i)=>"<div style=margin-top:6px>#"+(i+1)+" "+x.white.username+" vs "+x.black.username+" ("+x.white.result+")</div>").join("")}catch(e){out.textContent="Gagal memuat"}}run()</script></body></html>' > www/index.html
      - name: Build Capacitor iOS
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "4LeChess" "com.alesyhr.fourlechess" --web-dir=www
          npx cap add ios
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CONFIGURATION_BUILD_DIR=$PWD/build_out
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build_out/App.app Payload/4LeChess.app
          zip -r 4LeChess.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 4LeChess-IPA
          path: 4LeChess.ipa
